# support older version docker-compose
version: '3.3'
services:
  transmission:
    image: linuxserver/transmission:4.0.0
    container_name: transmission
    environment:
      - PUID=0
      - PGID=0
      - UMASK_SET=002
      - TZ=Asia/Shanghai
      - TRANSMISSION_WEB_HOME=/src
      - USER=transmission
      - PASS=transmission
    volumes:
      - ./web/src:/src
      - ./config:/config
      - ./downloads:/downloads
      - ./torrent-helper:/config/torrent-create:ro
      - ./torrent-helper/custom-services.d:/custom-services.d:ro
      - ./watch:/watch
    ports:
      - "9091:9091"
      - "3001:3001"
      - "51413:51413"
      - "51413:51413/udp"

    restart: unless-stopped
